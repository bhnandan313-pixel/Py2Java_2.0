spring.application.name=py2java-cloud-ide
server.port=8000
spring.jackson.default-property-inclusion=always

py2java.docker.python-image=python:3.12-alpine
py2java.docker.java-image=eclipse-temurin:21-jdk
py2java.docker.execution-timeout-seconds=8
py2java.docker.info-timeout-seconds=5
py2java.docker.memory-limit=128m
py2java.docker.cpu-limit=0.5
py2java.docker.pids-limit=64
py2java.docker.tmpfs-options=/tmp:rw,noexec,nosuid,size=64m
py2java.docker.container-user=10001:10001
